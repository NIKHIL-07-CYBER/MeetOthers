services:
  - type: web
    name: meetothers
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npx next start -H 0.0.0.0 -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      # TURN server credentials — get free credentials from xirsys.com
      # Uncomment and fill these in your Render dashboard (Environment > Secret Files)
      # - key: NEXT_PUBLIC_TURN_URL
      #   value: turn:YOUR_XIRSYS_HOST:3478
      # - key: NEXT_PUBLIC_TURN_USER
      #   value: YOUR_XIRSYS_USERNAME
      # - key: NEXT_PUBLIC_TURN_CRED
      #   value: YOUR_XIRSYS_CREDENTIAL
    headers:
      - path: /api/socket
        name: Cache-Control
        value: no-store
